<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In • IntellectRAG</title>
  <meta name="description" content="Sign in to IntellectRAG — your AI-powered knowledge hub with ChromaDB and LangGraph.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Glow Effects -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-container">
    <div class="login-card glass-panel">
      <div class="login-logo">
        <div class="logo-icon" style="font-size: 2.5rem; width: 60px; height: 60px;"><i class="fa-solid fa-brain-circuit"></i></div>
      </div>
      <h1 class="login-title">IntellectRAG</h1>
      <p class="login-subtitle">AI-Powered Knowledge Hub</p>
      <p class="login-desc">Sign in to access your knowledge base, upload documents, and ask AI questions grounded in your data.</p>

      <button id="btn-google-login" class="btn btn-google">
        <svg width="20" height="20" viewBox="0 0 24 24" style="margin-right: 10px;">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div id="login-error" class="login-error hidden"></div>

      <div id="login-loading" class="login-loading hidden">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <span>Signing you in...</span>
      </div>

      <div class="login-footer">
        <p>Your credentials are securely encrypted and stored per-user.</p>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnGoogle = document.getElementById('btn-google-login');
      const loginError = document.getElementById('login-error');
      const loginLoading = document.getElementById('login-loading');

      // If already signed in, redirect to main app
      auth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = '/index.html';
        }
      });

      btnGoogle.addEventListener('click', async () => {
        btnGoogle.disabled = true;
        loginError.classList.add('hidden');
        loginLoading.classList.remove('hidden');

        try {
          await signInWithGoogle();
          // onAuthStateChanged will handle the redirect
        } catch (error) {
          console.error('Google Sign-In failed:', error);
          loginError.textContent = error.message || 'Sign-in failed. Please try again.';
          loginError.classList.remove('hidden');
          loginLoading.classList.add('hidden');
          btnGoogle.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
