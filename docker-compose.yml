services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  chromadb-ui:
    image: fengzhichao/chromadb-admin:latest
    container_name: rag-chromadb-ui
    ports:
      - "3001:3001"
    environment:
      - CHROMA_ADMIN_DATABASE_URL=http://chromadb:8000
    depends_on:
      - chromadb
    restart: unless-stopped
